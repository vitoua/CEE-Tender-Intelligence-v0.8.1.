{% extends 'base.html' %}{% block c %}<h1>{{t.analytics}}</h1><form class="bar"><select name="sort_by"><option value="wins">{{t.wins}}</option><option value="value">{{t.value}}</option></select><select name="order"><option value="desc">↓</option><option value="asc">↑</option></select><button>{{t.apply}}</button></form><div class="table"><b>{{t.winner}}</b><b>{{t.wins}}</b><b>{{t.value}}</b><b>{{t.share}}</b>{% for r in rows %}<span>{{r.winner}}</span><span>{{r.wins}}</span><span>{{r.total}}</span><span>{{'%.1f'|format(r.share)}}%</span>{% endfor %}</div>{% endblock %}
